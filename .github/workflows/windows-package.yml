name: Windows Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/licensing/**'
      - 'package.json'
      - 'scripts/run-tests.mjs'
      - '.github/workflows/windows-package.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packaging dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Test
        shell: pwsh
        run: npm test
      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win -- --publish never
      - name: Smoke-check installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist/windows -Filter "*Setup.exe" -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not produced" }
          Write-Host "Installer: $($installer.FullName) $($installer.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: ef-agent-reliability-windows-unsigned
          path: |
            dist/windows/*.exe
            dist/windows/*.yml
            dist/windows/*.blockmap
